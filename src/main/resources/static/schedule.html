<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排程輸入頁面</title>
    <style>
        :root {
            font-family: "Segoe UI", Arial, sans-serif;
            color: #1f2937;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f3f4f6;
        }

        .page-header {
            width: min(100%, 840px);
            margin: 24px auto 0;
            padding: 0 24px;
            display: flex;
            justify-content: flex-end;
        }

        .logout-button {
            width: auto;
            background: #dc2626;
        }

        .delete-button {
            width: auto;
            background: #dc2626;
            padding: 6px 10px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        main {
            width: min(100%, 840px);
            margin: 40px auto;
            padding: 24px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin: 0 0 24px;
            font-size: 1.6rem;
        }

        form {
            display: grid;
            gap: 16px;
            margin-bottom: 28px;
        }

        label {
            display: grid;
            gap: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
        }

        button {
            width: 120px;
            padding: 10px 12px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
        }

        th,
        td {
            border: 1px solid #e5e7eb;
            padding: 10px 12px;
            text-align: left;
        }

        th {
            background: #f9fafb;
        }
    </style>
</head>
<body>
<header class="page-header">
    <button id="logout-button" class="logout-button" type="button">登出</button>
</header>
<main>
    <h1>新增排程</h1>
    <form id="schedule-form">
        <label for="schedule-datetime">
            日期時間
            <input id="schedule-datetime" name="schedule-datetime" type="datetime-local" lang="en-GB">
        </label>

        <label for="content">
            內容
            <input id="content" name="content" type="text" placeholder="請輸入內容">
        </label>

        <button type="submit">送出</button>
    </form>

    <table>
        <thead>
        <tr>
            <th hidden>ID</th>
            <th>日期時間</th>
            <th>內容</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="schedule-table-body">
        </tbody>
    </table>
</main>
<script>
    const scheduleForm = document.getElementById("schedule-form");
    const scheduleDatetimeInput = document.getElementById("schedule-datetime");
    const contentInput = document.getElementById("content");
    const logoutButton = document.getElementById("logout-button");
    const scheduleTableBody = document.getElementById("schedule-table-body");

    function getCookieValue(name) {
        const cookie = document.cookie
            .split("; ")
            .find((item) => item.startsWith(`${name}=`));
        return cookie ? decodeURIComponent(cookie.split("=").slice(1).join("=")) : "";
    }

    function clearAuthState() {
        document.cookie = "auth_token=; Path=/; Max-Age=0; SameSite=Lax";
        sessionStorage.removeItem("auth_session");
    }

    const sessionActive = sessionStorage.getItem("auth_session") === "active";
    const existingToken = getCookieValue("auth_token");
    if (!sessionActive || !existingToken) {
        clearAuthState();
        window.location.href = "/index.html";
    }

    logoutButton.addEventListener("click", () => {
        clearAuthState();
        window.location.href = "/index.html";
    });

    function formatDatetimeForInsert(datetimeLocalValue) {
        return datetimeLocalValue;
    }

    function formatDatetimeForDisplay(datetimeValue) {
        return datetimeValue.replace("T", " ");
    }

    function createCell(text) {
        const cell = document.createElement("td");
        cell.textContent = text;
        return cell;
    }

    function createDeleteButtonCell(scheduleId) {
        const actionCell = document.createElement("td");
        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-button";
        deleteButton.dataset.id = String(scheduleId);
        deleteButton.textContent = "刪除";
        actionCell.appendChild(deleteButton);
        return actionCell;
    }

    function renderSchedules(schedules) {
        scheduleTableBody.innerHTML = "";

        schedules.forEach((schedule) => {
            const row = document.createElement("tr");
            row.dataset.id = String(schedule.id);

            const idCell = createCell(String(schedule.id));
            idCell.hidden = true;

            row.appendChild(idCell);
            row.appendChild(createCell(formatDatetimeForDisplay(schedule.datetime)));
            row.appendChild(createCell(schedule.content));
            row.appendChild(createDeleteButtonCell(schedule.id));

            scheduleTableBody.appendChild(row);
        });
    }

    async function loadUnsendSchedules() {
        const token = getCookieValue("auth_token");
        if (!token) {
            return;
        }

        const response = await fetch("/api/schedule/get_unsend_schedule", {
            method: "GET",
            headers: {
                Authorization: `Bearer ${token}`
            }
        });

        if (!response.ok) {
            return;
        }

        const schedules = await response.json();
        renderSchedules(schedules);
    }

    scheduleForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const datetime = scheduleDatetimeInput.value.trim();
        const content = contentInput.value.trim();
        const token = getCookieValue("auth_token");

        if (!datetime || !content || !token) {
            return;
        }

        const response = await fetch("/api/schedule/insert_schedule", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({
                content,
                datetime: formatDatetimeForInsert(datetime)
            })
        });

        if (!response.ok) {
            return;
        }

        scheduleDatetimeInput.value = "";
        contentInput.value = "";
        await loadUnsendSchedules();
    });

    scheduleTableBody.addEventListener("click", async (event) => {
        const target = event.target;
        if (!(target instanceof HTMLButtonElement) || !target.classList.contains("delete-button")) {
            return;
        }

        const scheduleId = Number(target.dataset.id);
        const token = getCookieValue("auth_token");
        if (!Number.isInteger(scheduleId) || !token) {
            return;
        }

        await fetch("/api/schedule/delete_schedule", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({
                id: scheduleId
            })
        });

        await loadUnsendSchedules();
    });

    loadUnsendSchedules();

    scheduleDatetimeInput.addEventListener("change", () => {
        scheduleDatetimeInput.blur();
    });

    document.addEventListener("pointerdown", (event) => {
        if (event.target !== scheduleDatetimeInput) {
            scheduleDatetimeInput.blur();
        }
    });
</script>
</body>
</html>
